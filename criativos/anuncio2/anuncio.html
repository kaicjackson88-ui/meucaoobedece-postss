function construir(){
  const C=montar(), S=i=>SEG[i];
  const ini=i=>i===0?0:S(i).ini-.3;
  C.forEach((c,i)=>{
    const a=ini(i), b=i<C.length-1?ini(i+1):DUR;
    if(i===0) tl.set(c,{autoAlpha:1},0);
    else tl.fromTo(c,{autoAlpha:0,scale:1.12,filter:'blur(16px)'},{autoAlpha:1,scale:1,filter:'blur(0px)',duration:.5,ease:'power3.out'},a);
    if(i<C.length-1) tl.to(c,{autoAlpha:0,scale:.9,filter:'blur(14px)',duration:.4,ease:'power2.in'},b-.05);
    if(i>0) SFX.whoosh.push(a);
    tl.fromTo(c.querySelector('.grade'),{x:0,y:0},{x:-64,y:-64,duration:b-a+.5,ease:'none'},a);  // fundo sempre em movimento
  });
  tl.fromTo('#flash',{opacity:0},{keyframes:[{opacity:.55,duration:.06},{opacity:0,duration:.3}]},ini(7)+.05);
  // 0 gancho: cartões vindo do fundo em 3D
  tl.fromTo('#t0',{scale:.6,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(2.5)'},0);
  [0,1,2,3].forEach(i=>{const t0=.15+i*.32;
    tl.fromTo('#dor'+i,{z:-1400,rotationX:50,rotationY:i%2?-30:30,opacity:0},{z:0,rotationX:0,rotationY:0,opacity:1,duration:.7,ease:'back.out(1.5)'},t0)
      .fromTo('#dor'+i+' .x',{scale:0,rotation:-90},{scale:1,rotation:0,duration:.4,ease:'back.out(3)'},t0+.45)
      .to('#dor'+i,{y:'+=14',rotationZ:i%2?1.2:-1.2,duration:1.2,ease:'sine.inOut',yoyo:true,repeat:3},t0+.7);SFX.pop.push(t0+.45)});
  // 1 virada
  const s1=S(1).ini, tEnt=achar(/entend/,s1,s1+1.6);
  tl.fromTo('#v1',{y:80,opacity:0,scale:.8},{y:0,opacity:1,scale:1,duration:.55,ease:'back.out(2)'},s1-.1)
    .fromTo('#v2',{y:80,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},Math.max(s1+.4,tEnt-.6))
    .fromTo('#v3',{scale:.3,rotation:-8},{scale:1,rotation:-3,duration:.6,ease:'elastic.out(1,.45)'},tEnt-.05)
    .fromTo('#vm',{y:500,rotation:-10},{y:0,rotation:0,duration:.7,ease:'back.out(1.6)'},s1+.2)
    .to('#vm',{y:-18,duration:.6,yoyo:true,repeat:3,ease:'sine.inOut'},s1+.9);
  SFX.boom.push(tEnt);
  // 2 como funciona
  const s2=S(2).ini, f2=S(2).fim, tFeito=achar(/feito/,s2,s2+3.2), tDest=achar(/destrava/,s2,f2-1), dCro=Math.max(1,tFeito-s2-1);
  T.dest=tDest;
  tl.fromTo('#fone2',{y:900,rotationY:-35,rotationX:18,rotationZ:6},{y:0,rotationY:-16,rotationX:8,rotationZ:0,duration:.9,ease:'power3.out'},s2-.2)
    .to('#fone2',{rotationY:10,rotationX:4,duration:f2-s2,ease:'sine.inOut'},s2+.7)
    .fromTo('#bar2',{width:'0%'},{width:'19%',duration:.8,ease:'power2.out'},s2+.6)
    .to('#bar2',{width:'24%',duration:.5,ease:'power2.out'},tDest+.2);
  ['#c2a','#c2b','#c2c'].forEach((c,i)=>{tl.fromTo(c,{scale:0,z:-500,rotation:i%2?12:-12},{scale:1,z:90,rotation:i%2?4:-4,duration:.55,ease:'back.out(2.2)'},s2+.5+i*.35)
    .to(c,{y:'+=26',duration:1.2,yoyo:true,repeat:3,ease:'sine.inOut'},s2+1.1+i*.35);SFX.pop.push(s2+.5+i*.35)});
  T.cro={k:0};tl.to(T.cro,{k:1,duration:dCro,ease:'none'},s2+.8);
  tl.fromTo('#anel',{attr:{'stroke-dashoffset':364.4}},{attr:{'stroke-dashoffset':0},duration:dCro,ease:'none'},s2+.8);
  [0,1,2].forEach(i=>{const tt=s2+1.1+i*dCro/3.3;tl.fromTo('#ck'+i,{scale:0},{scale:1,duration:.35,ease:'back.out(3)'},tt);SFX.tick.push(tt)});
  tl.to('#btn2',{keyframes:[{scale:.92,y:8,duration:.1},{scale:1,y:0,duration:.2}]},tFeito-.1);SFX.ding.push(tFeito);
  tl.fromTo('#lib2',{opacity:0,scale:.5,rotationX:-60},{opacity:1,scale:1,rotationX:0,duration:.6,ease:'back.out(1.8)'},tDest-.2)
    .fromTo('#arco',{y:0},{y:-16,duration:.4,ease:'back.out(3)'},tDest+.25);
  SFX.sucesso.push(tDest+.25);
  // 3 gamificação
  const s3=S(3).ini, f3=S(3).fim, tAp=achar(/apetrech/,s3,s3+3.5);
  T.monta=[s3+.3,Math.max(s3+1.2,Math.min(tAp-.4,s3+3))];T.itens=[];
  tl.fromTo('#g0',{scale:.5,opacity:0,rotation:-6},{scale:1,opacity:1,rotation:0,duration:.55,ease:'back.out(2.5)'},s3-.15)
    .fromTo('#gm',{scale:.4,opacity:0},{scale:1,opacity:1,duration:.6,ease:'back.out(2)'},s3-.1)
    .fromTo('#gcont',{y:300,opacity:0},{y:0,opacity:1,duration:.5,ease:'back.out(2)'},s3+.4);
  T.num={n:0};tl.to(T.num,{n:400,duration:1.6,ease:'power2.out'},s3+.6);
  DIAS.forEach((d,i)=>{const tt=tAp+.1+i*Math.min(.42,Math.max(.25,(f3-tAp)/6.5));T.itens.push(tt);
    tl.fromTo('#gi'+i,{opacity:0,scale:.3,z:-400},{opacity:1,scale:1,z:0,duration:.4,ease:'back.out(2.5)'},tt);SFX.pop.push(tt)});
  for(let k=0;k<12;k++)SFX.tick.push(T.monta[0]+k*(T.monta[1]-T.monta[0])/12);
  // 4 skins — carrossel girando
  const s4=S(4).ini, f4=S(4).fim;
  T.car={a:-240};tl.fromTo(T.car,{a:-240},{a:0,duration:Math.max(1.5,f4-s4+.2),ease:'power2.inOut'},s4-.2);
  tl.fromTo('#tr1',{x:0},{x:-900,duration:f4-s4+1.5,ease:'none'},s4-.3).fromTo('#tr2',{x:0},{x:900,duration:f4-s4+1.5,ease:'none'},s4-.3);
  ['avent','guard','lend'].forEach((w,i)=>{const tt=achar(new RegExp(w),s4,s4+.8+i*.7);SFX.whoosh.push(tt-.1);if(i===2)SFX.sucesso.push(tt)});
  // 5 provas — janelas flutuando, câmera em órbita
  const s5=S(5).ini, f5=S(5).fim;
  tl.fromTo('#cam5',{rotationY:-18,rotationX:6,z:-200},{rotationY:12,rotationX:-4,z:80,duration:f5-s5+.6,ease:'sine.inOut'},s5-.3);
  const passo=Math.max(.7,(f5-s5+.4)/5);
  POS.forEach((p,i)=>{const tt=s5-.2+i*passo;
    tl.fromTo('#j'+i,{x:0,y:0,z:-1800,rotationY:40,rotationX:10,opacity:0,scale:1},{z:260,rotationY:0,rotationX:0,opacity:1,duration:.5,ease:'power3.out'},tt);
    if(i<POS.length-1) tl.to('#j'+i,{x:p[0]-260,y:p[1]-560,z:p[2]-180,rotationY:p[3],scale:.86,duration:.6,ease:'power2.inOut'},tt+passo-.15)
      .to('#j'+i,{y:'+=16',rotationZ:i%2?1.5:-1.5,duration:1.3+i*.15,yoyo:true,repeat:3,ease:'sine.inOut'},tt+passo+.45);
    else tl.to('#j'+i,{y:'+=14',duration:1.2,yoyo:true,repeat:3,ease:'sine.inOut'},tt+.5);
    SFX.notif.push(tt+.15)});
  // 6 certificado
  const s6=S(6).ini, tNome=achar(/nome/,s6,s6+1.6);
  tl.fromTo('#cert',{rotationX:75,y:500,opacity:0},{rotationX:0,y:0,opacity:1,duration:.9,ease:'power3.out'},s6-.2)
    .to('#cert',{rotationY:-8,rotationX:4,duration:S(6).fim-s6+.4,ease:'sine.inOut'},s6+.7)
    .fromTo('#cnome',{scale:2.2,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(2)'},tNome-.1)
    .fromTo('#selo',{scale:3,rotation:-40,opacity:0},{scale:1,rotation:-12,opacity:1,duration:.35,ease:'power4.in'},tNome+.5)
    .fromTo('#c6',{opacity:0,y:60},{opacity:1,y:0,duration:.4,ease:'back.out(2)'},tNome+.9);
  SFX.boom.push(tNome+.85);SFX.ding.push(tNome);
  // 7 oferta + garantia
  const s7=S(7).ini, t37=achar(/trinta|37/,s7,s7+.3), tGar=achar(/garantia/,s7,s7+3);
  tl.fromTo('#o1',{y:-300,opacity:0,rotationX:-40},{y:0,opacity:1,rotationX:0,duration:.6,ease:'back.out(1.8)'},s7-.25)
    .fromTo('#risco',{width:0},{width:'110%',duration:.35,ease:'power2.out'},s7+.3)
    .fromTo('#o2',{scale:.3,opacity:0},{scale:1,opacity:1,duration:.8,ease:'elastic.out(1,.5)'},Math.max(s7+.5,t37-.1))
    .fromTo('#o3',{y:500,rotationX:50,opacity:0},{y:0,rotationX:0,opacity:1,duration:.7,ease:'back.out(1.5)'},tGar-.3)
    .to('#o3',{scale:1.03,duration:.5,yoyo:true,repeat:3,ease:'sine.inOut'},tGar+.5);
  SFX.boom.push(t37);SFX.ding.push(tGar);
  // 8 cta quiz
  const s8=S(8).ini;
  tl.fromTo('#fone8',{y:900,rotationY:25,rotationX:10},{y:0,rotationY:-10,rotationX:6,duration:.8,ease:'power3.out'},s8-.25)
    .fromTo('#dedo',{x:200,y:300,opacity:0},{x:-80,y:-380,opacity:1,duration:.6,ease:'power2.inOut'},s8+.5)
    .to('#dedo',{scale:.8,duration:.12,yoyo:true,repeat:1},s8+1.1)
    .to('#op1',{backgroundColor:'#E9F5F2',borderColor:'#2F9C8A',duration:.2},s8+1.15)
    .fromTo('#cta',{scale:0,y:80},{scale:1,y:0,duration:.6,ease:'back.out(2.5)'},s8+1.4)
    .to('#cta',{scale:1.06,duration:.45,yoyo:true,repeat:9,ease:'sine.inOut'},s8+2)
    .fromTo('#cta2',{opacity:0,y:30},{opacity:1,y:0,duration:.4},s8+1.8)
    .to('#cta2',{y:16,duration:.4,yoyo:true,repeat:11,ease:'sine.inOut'},s8+2.2);
  SFX.pop.push(s8+1.15);SFX.boom.push(s8+1.4);
  tl.to({},{duration:.01},DUR);
}

// mascote que muda: montagem (trocando corpo/orelha/cor) e depois ganhando apetrechos
let ultimoGM='';
function mascoteMontagem(t){
  let op;
  if(t<T.monta[1]){const k=Math.max(0,Math.floor((t-T.monta[0])/((T.monta[1]-T.monta[0])/12)));
    op=Object.assign({},VAR[k%VAR.length],{coleira:k%8,rabo:k%4,focinho:(k*3)%4,itens:[]});}
  else{const it=[];T.itens.forEach((tt,i)=>{if(t>=tt)it.push(DIAS[i][0])});op=Object.assign({},THOR,{olhar:it.length>2?3:0,itens:it});}
  const key=JSON.stringify(op);if(key!==ultimoGM){$('gm').innerHTML=mascote(op);ultimoGM=key}
}
function carrossel(){
  [0,1,2].forEach(i=>{const ang=(i-2)*120+T.car.a, r=ang*Math.PI/180, el=$('sk'+i);
    const x=Math.sin(r)*380, z=Math.cos(r)*380-380;
    el.style.transform='translate3d('+x.toFixed(1)+'px,0,'+z.toFixed(1)+'px) rotateY('+ang.toFixed(1)+'deg)';
    el.style.zIndex=String(Math.round(1000+z));el.style.opacity=Math.cos(r)>-0.3?'1':'0'});
}
// legenda karaokê (texto do roteiro + tempo do Whisper)
const BL=[];
function blocos(){let b=[];PALAVRAS.forEach((p,i)=>{b.push(i);const prox=PALAVRAS[i+1];if(b.length>=3||/[.,!?:]$/.test(p.w)||(prox&&prox.ini-p.fim>.35)){BL.push(b);b=[]}});if(b.length)BL.push(b)}
let ultLeg='';
function legenda(t){let bi=-1;BL.forEach((b,i)=>{if(t>=PALAVRAS[b[0]].ini-.08)bi=i});
  let h='';if(bi>=0){const b=BL[bi];if(t<=PALAVRAS[b[b.length-1]].fim+.45)h=b.map(j=>'<span class="'+(t>=PALAVRAS[j].ini-.03&&t<(PALAVRAS[j+1]?Math.min(PALAVRAS[j+1].ini-.03,PALAVRAS[j].fim+.25):PALAVRAS[j].fim+.25)?'on':'')+'">'+PALAVRAS[j].w.replace(/[.,!?:]$/,'')+'</span>').join(' ')}
  if(h!==ultLeg){$('leg').innerHTML=h;ultLeg=h}}

function render(t){
  tl.seek(t,true);
  const s=Math.round(900-900*T.cro.k);$('crono').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  $('dia2').textContent=t>=T.dest+.2?'DIA 5 DE 21':'DIA 4 DE 21';
  $('gnum').textContent='+'+Math.round(T.num.n)+' mil';
  mascoteMontagem(t);carrossel();legenda(t);
}
window.load=function(){construir();blocos();window.SFX=SFX;render(0);return true};
</script></body></html>
