name: Google Trends (pesquisa)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar
        run: |
          pip install -q pytrends pandas
          python scripts/tendencias_google.py || true
      - name: Guardar
        if: always()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add dados/google_trends.txt && git commit -qm "pesquisa: google trends" && git pull -q --rebase && git push -q || echo nada
