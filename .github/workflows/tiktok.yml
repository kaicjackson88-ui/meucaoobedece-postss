name: TikTok — lote de vídeos

on:
  schedule:
    - cron: "17 16 * * 0"   # domingo 13h17 (Brasília), depois do roteirista: lote da semana
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantos vídeos gerar"
        required: false
        default: "21"
      ids:
        description: "IDs específicos (opcional, separados por vírgula)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de vídeo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts==7.2.8 playwright==1.55.0 numpy scipy
          python -m playwright install --with-deps chromium
      - name: Gerar lote e publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
          QTD: ${{ github.event.inputs.quantidade || '21' }}
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then python scripts/tiktok.py lote "$QTD" --ids "$IDS"; else python scripts/tiktok.py lote "$QTD"; fi
      - name: Salvar registro
        run: |
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "robo-meu-cao-obedece"
            git config user.email "robo@users.noreply.github.com"
            git add dados && git commit -qm "TikTok: lote gerado" && git pull --rebase -q && git push -q
          fi
