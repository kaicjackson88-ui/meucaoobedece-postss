name: Postar vídeo pronto (histórias animadas)

on:
  workflow_dispatch:
    inputs:
      id:
        description: "id do vídeo em prontos/ (ex.: mco1)"
        required: true

permissions:
  contents: write

concurrency:
  group: postar-carrossel
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/postar_pronto.py ${{ inputs.id }}
      - name: Registrar
        if: success()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add dados/reels_publicados.json && git commit -qm "Vídeo pronto publicado: ${{ inputs.id }}" && git pull --rebase -q && git push || echo nada
