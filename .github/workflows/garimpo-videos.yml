name: Garimpo de vídeos (Pixabay / Pexels / Mixkit)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ferramentas
        run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - name: Garimpar (Pixabay se houver a chave; senão Pexels; senão Mixkit)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p garimpo
          if [ -n "$PIXABAY_API_KEY" ]; then s=garimpo_pixabay; elif [ -n "$PEXELS_API_KEY" ]; then s=garimpo_pexels; else s=garimpo_videos; fi
          echo "fonte: $s" | tee garimpo/log.txt
          python scripts/$s.py 2>&1 | tee -a garimpo/log.txt
      - name: Subir resultado num branch próprio
        if: always()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          python -c "import sys,glob;sys.path.insert(0,'scripts');import reels;print(reels.subir_arquivos(sorted(glob.glob('garimpo/*')),'garimpo-videos'))"
