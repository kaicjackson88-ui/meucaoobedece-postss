name: Pesquisa automática (sem Claude)

on:
  schedule:
    - cron: "17 0 * * 2,5"   # segunda e quinta, 21:17 (Brasília)
  workflow_dispatch:
    inputs:
      acao:
        description: "pesquisar = pesquisa de tendências | escrever = IA gratuita escreve histórias agora"
        required: true
        default: "pesquisar"
        type: choice
        options: [pesquisar, escrever]
      quantidade:
        description: "Quantas histórias escrever (só para escrever)"
        required: false
        default: "1"

permissions:
  contents: write
  models: read

concurrency:
  group: pesquisa
  cancel-in-progress: false

jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pesquisar tendências
        if: github.event_name == 'schedule' || github.event.inputs.acao == 'pesquisar'
        run: python scripts/pesquisa_auto.py
      - name: Escrever histórias com a IA gratuita
        if: github.event.inputs.acao == 'escrever'
        run: python scripts/roteirista_auto.py ${{ github.event.inputs.quantidade }}
      - name: Salvar
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados tiktok)" ]; then
            git config user.name "robo-meu-cao-obedece"
            git config user.email "robo@users.noreply.github.com"
            git add dados tiktok && git commit -qm "Pesquisa/roteiros automáticos" && git pull --rebase --autostash -q && git push -q
          fi
