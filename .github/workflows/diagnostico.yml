name: Diagnóstico da chave

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/diagnostico.py
