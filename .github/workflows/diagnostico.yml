name: Diagnóstico da chave

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/diagnostico.py | tee dados/diagnostico.txt
      - name: Salvar resultado
        run: |
          git config user.name "robo-meu-cao-obedece"
          git config user.email "robo@users.noreply.github.com"
          git add dados/diagnostico.txt && git commit -qm "Diagnóstico da chave" && git pull --rebase -q && git push -q || true
