name: Ver checkout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install -q playwright==1.55.0
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Abrir checkout
        run: python scripts/ver_checkout.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add dados/checkout_* && git commit -qm "checkout: prints" && git pull -q --rebase && git push -q || echo nada
