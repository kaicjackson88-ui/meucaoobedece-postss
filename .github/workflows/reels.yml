name: Reels automáticos

on:
  schedule:
    - cron: "12 * * * *"   # confere de hora em hora; fica de plantão até 5h20 esperando os próximos horários
  workflow_dispatch:
    inputs:
      roteiro:
        description: "ID do roteiro (vazio = o robô escolhe)"
        required: false
        default: ""
      modo:
        description: "teste = só gera o vídeo | postar = gera e posta agora | turno = liga o plantão agora"
        required: false
        default: "teste"

permissions:
  contents: write
  actions: write

concurrency:
  group: reels-${{ (github.event_name == 'schedule' || github.event.inputs.modo == 'turno') && 'plantao' || 'manual' }}
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vigiar o plantão dos vídeos (TikTok/YouTube)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          W="repos/${{ github.repository }}/actions/workflows/tiktok-rascunhos.yml"
          N=0
          for st in in_progress queued waiting pending requested; do
            k=$(gh api "$W/runs?status=$st&per_page=10" --jq '.workflow_runs | length' || echo 0); N=$((N + k))
          done
          if [ "$N" = "0" ]; then echo "plantão dos vídeos caído — religando"; gh api -X POST "$W/dispatches" -f ref=main -f "inputs[acao]=turno"; fi

      - name: Já tem plantão rodando?
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/reels.yml/runs?status=in_progress&per_page=20" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.event == \"schedule\" or .display_title == \"Reels automáticos\")] | length")
          echo "outros=$N" >> "$GITHUB_OUTPUT"; echo "plantões rodando: $N"

      - name: Tem Reels pra fazer agora?
        id: precisa
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.dup.outputs.outros }}" != "0" ]; then echo "sim=nao" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "sim=sim" >> "$GITHUB_OUTPUT"
          else echo "sim=$(python scripts/reels.py precisa)" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar ferramentas de vídeo
        if: steps.precisa.outputs.sim == 'sim'
        run: |
          pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg && ffmpeg -version | head -1  # sem apt: o espelho do Ubuntu às vezes trava
          pip install -q edge-tts==7.2.8 playwright==1.55.0 numpy scipy
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium

      - name: Produzir e postar Reels
        if: steps.precisa.outputs.sim == 'sim'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          ROTEIRO: ${{ github.event.inputs.roteiro }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          git config user.name "robo-meu-cao-obedece"
          git config user.email "robo@users.noreply.github.com"
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$MODO" = "turno" ]; then
            python scripts/reels.py turno 2>&1 | tee dados/ultima_execucao.log
          else
            ARGS=""
            if [ -n "$ROTEIRO" ]; then ARGS="$ARGS --forcar $ROTEIRO"; fi
            if [ "$MODO" = "teste" ]; then ARGS="$ARGS --teste"; fi
            python scripts/reels.py postar $ARGS 2>&1 | tee dados/ultima_execucao.log
          fi

      - name: Responder quem comentou XIXI
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/responder.py 2>&1 | tee dados/ultima_resposta.log

      - name: Salvar registros
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados reels)" ]; then
            git config user.name "robo-meu-cao-obedece"
            git config user.email "robo@users.noreply.github.com"
            git add dados reels
            git commit -m "Reels: registros atualizados"
            git pull --rebase --autostash -q && git push -q
          fi
          git pull --rebase --autostash -q && git push -q || true

      - name: Encadear o próximo plantão
        if: always() && (github.event_name == 'schedule' || github.event.inputs.modo == 'turno') && steps.precisa.outputs.sim == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/reels.yml/dispatches" -f ref=main -f "inputs[modo]=turno"
