name: Anúncio completo 3D (gera para aprovar)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anuncio2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: |
          pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          pip install -q edge-tts==7.2.8 playwright==1.55.0 numpy scipy faster-whisper
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
          npm i --no-save gsap
      - name: Gerar anúncio
        run: set -o pipefail; python criativos/anuncio2/render.py 2>&1 | tee criativos/anuncio2/log.txt
      - name: Subir os vídeos
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          python -c "import sys,glob;sys.path.insert(0,'scripts');import reels;print(reels.subir_arquivos(sorted(glob.glob('criativos/anuncio2/videos/*')),'midia-anuncios'))"
      - name: Guardar log se falhar
        if: failure()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add -f criativos/anuncio2/log.txt && git commit -qm "anúncio 3D: log" && git pull -q --rebase && git push -q
