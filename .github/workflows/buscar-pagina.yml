name: Copiar página de vendas (para criativos)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar a página e as imagens
        run: |
          mkdir -p criativos/pagina && cd criativos/pagina
          wget -q -e robots=off --page-requisites --convert-links --adjust-extension --span-hosts \
               --domains=meucaoobedece.vercel.app -nd -P . https://meucaoobedece.vercel.app/ || true
          ls -la
      - name: Salvar
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add criativos && git commit -qm "Cópia da página de vendas para criativos" && git pull -q --rebase && git push -q || echo nada
