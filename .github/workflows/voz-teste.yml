name: Diagnóstico da voz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q edge-tts==7.2.8 piper-tts
      - run: python scripts/voz_teste.py 2>&1 | tee -a dados/voz_teste_log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          for f in dados/voz_teste.txt dados/voz_versao.txt dados/voz_teste_log.txt; do [ -f $f ] && git add -f $f; done; git commit -qm "voz: diagnóstico" && git pull -q --rebase && git push -q || echo nada
