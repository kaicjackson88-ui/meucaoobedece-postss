name: Gestor de anúncios Meta

on:
  schedule:
    - cron: "7 12 * * *"   # 09:07 BRT — relatório + regras de corte
    - cron: "7 0 * * *"    # 21:07 BRT
  workflow_dispatch:
    inputs:
      acao:
        description: "checar | montar | ativar | pausar | relatorio"
        required: false
        default: "checar"
      campanha:
        description: "arquivo da campanha"
        required: false
        default: "anuncios/teste2.json"

permissions:
  contents: write

jobs:
  anuncios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACAO: ${{ github.event_name == 'schedule' && 'relatorio' || inputs.acao }}
          CAMPANHA: ${{ inputs.campanha || 'anuncios/teste2.json' }}
        run: |
          set -o pipefail
          mkdir -p dados
          if [ "$ACAO" = "relatorio" ] && ! grep -q ativado_em dados/meta_campanha_*.json 2>/dev/null; then echo "Nenhuma campanha ligada ainda."; exit 0; fi
          python scripts/anuncios_meta.py "$ACAO" "$CAMPANHA" 2>&1 | tee dados/meta_anuncios_log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add dados/meta_* && git commit -qm "Anúncios Meta: registro" && git pull -q --rebase --autostash && git push -q || echo nada
