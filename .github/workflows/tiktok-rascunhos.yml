name: TikTok — rascunhos diários

on:
  schedule:
    - cron: "27 * * * *"   # de hora em hora: renderiza as histórias de madrugada e manda os lotes 05:20 / 11:50 / 17:20
  workflow_dispatch:
    inputs:
      acao:
        description: "enviar = segue a agenda | autorizar = conecta a conta | reserva = BOTÃO DE EMERGÊNCIA: cria histórias reserva agora"
        required: true
        default: "enviar"
        type: choice
        options: [enviar, autorizar, reserva]
      codigo:
        description: "Código que apareceu depois de conectar (só para autorizar)"
        required: false
        default: ""
      quantidade:
        description: "Quantas histórias mandar AGORA (vazio = segue a agenda dos lotes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tiktok-rascunhos
  cancel-in-progress: false

jobs:
  rascunhos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conectar conta
        if: github.event.inputs.acao == 'autorizar'
        env:
          CODIGO: ${{ github.event.inputs.codigo }}
        run: python scripts/tiktok_rascunho.py autorizar "$CODIGO"
      - name: Botão de emergência — criar histórias reserva
        if: github.event.inputs.acao == 'reserva'
        env:
          QTD: ${{ github.event.inputs.quantidade }}
        run: python scripts/gerador_historias.py ${QTD:-45}
      - name: Tem vídeo pra mandar?
        id: precisa
        if: github.event.inputs.acao != 'autorizar' && github.event.inputs.acao != 'reserva'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "sim=sim" >> "$GITHUB_OUTPUT"
          else echo "sim=$(python scripts/tiktok_rascunho.py precisa)" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar ferramentas de vídeo
        if: steps.precisa.outputs.sim == 'sim'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts==7.2.8 playwright==1.55.0 numpy scipy
          python -m playwright install --with-deps chromium
      - name: Gerar e mandar para os rascunhos
        if: steps.precisa.outputs.sim == 'sim'
        env:
          QTD: ${{ github.event.inputs.quantidade }}
        run: |
          git config user.name "robo-meu-cao-obedece"
          git config user.email "robo@users.noreply.github.com"
          python scripts/tiktok_rascunho.py enviar $QTD
      - name: Salvar
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados docs tiktok)" ]; then
            git config user.name "robo-meu-cao-obedece"
            git config user.email "robo@users.noreply.github.com"
            git add dados docs tiktok && git commit -qm "TikTok: registros" && git pull --rebase --autostash -q && git push -q
          fi
