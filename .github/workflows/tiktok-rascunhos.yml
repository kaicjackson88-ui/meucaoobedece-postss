name: TikTok — rascunhos diários

on:
  schedule:
    - cron: "27 */6 * * *"   # só reserva: o plantão se religa sozinho (renderiza de madrugada, lotes 05:20 / 11:50 / 17:20, Shorts)
  workflow_dispatch:
    inputs:
      acao:
        description: "enviar = segue a agenda | autorizar = conecta a conta | reserva = BOTÃO DE EMERGÊNCIA: cria histórias reserva agora"
        required: true
        default: "enviar"
        type: choice
        options: [turno, enviar, autorizar, reserva]
      codigo:
        description: "Código que apareceu depois de conectar (só para autorizar)"
        required: false
        default: ""
      quantidade:
        description: "Quantas histórias mandar AGORA (vazio = segue a agenda dos lotes)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: tiktok-rascunhos
  cancel-in-progress: false

jobs:
  rascunhos:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conectar conta
        if: github.event.inputs.acao == 'autorizar'
        env:
          CODIGO: ${{ github.event.inputs.codigo }}
        run: python scripts/tiktok_rascunho.py autorizar "$CODIGO"
      - name: Botão de emergência — criar histórias reserva
        if: github.event.inputs.acao == 'reserva'
        env:
          QTD: ${{ github.event.inputs.quantidade }}
        run: python scripts/gerador_historias.py ${QTD:-45}
      - name: Instalar ferramentas de vídeo
        if: github.event.inputs.acao != 'autorizar' && github.event.inputs.acao != 'reserva'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts==7.2.8 playwright==1.55.0 numpy scipy
          python -m playwright install --with-deps chromium
      - name: Plantão (renderiza de madrugada, manda lotes do TikTok e sobe Shorts no YouTube)
        if: github.event_name == 'schedule' || github.event.inputs.acao == 'turno'
        run: |
          git config user.name "robo-meu-cao-obedece"
          git config user.email "robo@users.noreply.github.com"
          python scripts/turno_videos.py 2>&1 | tee dados/turno_videos.log
      - name: Mandar agora (manual)
        if: github.event.inputs.acao == 'enviar'
        env:
          QTD: ${{ github.event.inputs.quantidade }}
        run: |
          git config user.name "robo-meu-cao-obedece"
          git config user.email "robo@users.noreply.github.com"
          python scripts/tiktok_rascunho.py enviar $QTD
      - name: Salvar
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados docs tiktok)" ]; then
            git config user.name "robo-meu-cao-obedece"
            git config user.email "robo@users.noreply.github.com"
            git add dados docs tiktok && git commit -qm "TikTok: registros" && git pull --rebase --autostash -q && git push -q
          fi
      - name: Religar o plantão
        if: always() && (github.event_name == 'schedule' || github.event.inputs.acao == 'turno')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/tiktok-rascunhos.yml/dispatches" -f ref=main -f "inputs[acao]=turno"
