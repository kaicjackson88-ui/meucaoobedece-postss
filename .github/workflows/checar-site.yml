name: Conferir site no ar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir
        run: |
          {
            echo "Conferido em: $(date -u '+%Y-%m-%d %H:%M UTC')"
            for u in "https://meucaoobedece.vercel.app/" "https://meucaoobedece.vercel.app/upsell.html"; do
              code=$(curl -s -o /tmp/p.html -w '%{http_code}' -L "$u")
              echo "$u -> HTTP $code, $(wc -c < /tmp/p.html) bytes"
              grep -q "Quiz | marcou mordida" /tmp/p.html && echo "  quiz corrigido: SIM" || true
              grep -q "Por que não indico o método" /tmp/p.html && echo "  quiz antigo (bloqueio): AINDA NO AR" || true
              grep -q "Plano Ansiedade de Separação" /tmp/p.html && echo "  upsell: OK" || true
            done
          } | tee dados/site_check.txt
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add dados/site_check.txt && git commit -qm "site: conferência" && git pull -q --rebase && git push -q || echo nada
