name: Aprender com as métricas

on:
  schedule:
    - cron: "40 2 * * *"   # todo dia 23:40 (Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar métricas e recalcular pesos
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/metricas.py
        continue-on-error: true
      - name: Métricas do TikTok (o que dá mais view e engajamento)
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python scripts/tiktok_metricas.py
      - name: Salvar
        if: always()
        run: |
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "robo-meu-cao-obedece"
            git config user.email "robo@users.noreply.github.com"
            git add dados && git commit -m "Métricas atualizadas" && git pull --rebase --autostash -q && git push -q
          fi
