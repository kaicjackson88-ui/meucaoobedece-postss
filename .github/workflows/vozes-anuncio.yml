name: Vozes de anúncio (Gemini)

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta com falas.json (ex.: criativos/anuncio3)"
        required: true

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy scipy
      - name: Gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PASTA: ${{ inputs.pasta }}
        run: python scripts/vozes_anuncio.py "$PASTA"
      - name: Salvar
        if: always()
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          git config user.name "robo-meu-cao-obedece"; git config user.email "robo@users.noreply.github.com"
          git add "$PASTA/voz" && git commit -qm "Vozes do anúncio ($PASTA)" || { echo "nada novo"; exit 0; }
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
