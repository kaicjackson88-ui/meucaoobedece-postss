<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar YouTube — O Corre do Biel</title><link rel="stylesheet" href="estilo.css"></head>
<body><main><div class="marca">🔧 O Corre do Biel</div><h1>Conectar o YouTube</h1><div id="c"></div>
<script>
const q=new URLSearchParams(location.search),code=q.get('code'),err=q.get('error'),c=document.getElementById('c');
const R=location.origin+location.pathname;
if(code){c.innerHTML='<p>Pronto! Copie o código abaixo e cole no GitHub › esefossevoce-bot › Actions › <b>YouTube Shorts (Biel)</b> › Run workflow › ação <b>autorizar</b>. Ele vale só alguns minutos.</p><div class="caixa" id="k"></div><p><button id="cp">Copiar código</button></p>';
 document.getElementById('k').textContent=code;document.getElementById('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(code);const t=document.createElement('textarea');t.value=code;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){};document.getElementById('cp').textContent='Copiado ✓'}}
else{c.innerHTML=(err?'<p>Erro: '+err+'. Tente de novo.</p>':'')+'<p>Cole o <b>ID do cliente</b> (Client ID) do Google Cloud e toque em conectar. Entre com a conta do canal <b>O Corre do Biel</b>.</p><input id="ck" placeholder="termina com .apps.googleusercontent.com" autocomplete="off"><p><button id="ir">Conectar com o YouTube</button></p>';
 document.getElementById('ir').onclick=()=>{const ck=document.getElementById('ck').value.replace(/\s+/g,'');if(!ck){alert('Cole o ID do cliente');return}if(ck.startsWith('GOCSPX')){alert('Isso é a CHAVE SECRETA. Aqui vai o ID do cliente (termina com .apps.googleusercontent.com).');return}if(!/^\d+-[a-z0-9]+\.apps\.googleusercontent\.com$/.test(ck)){alert('O ID do cliente está incompleto. Ele começa com números e termina com .apps.googleusercontent.com — copie de novo pelo ícone de copiar.');return}
  const sc='https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.force-ssl';
  location.href='https://accounts.google.com/o/oauth2/v2/auth?client_id='+encodeURIComponent(ck)+'&redirect_uri='+encodeURIComponent(R)+'&response_type=code&access_type=offline&prompt=select_account%20consent&scope='+encodeURIComponent(sc)}}
</script></main></body></html>
